<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            color: #0b3d62;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0b3d62;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #094f7d;
        }

        .flash-message {
            background: #e7f6ec;
            color: #1e7e34;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        p {
            margin-top: 15px;
            text-align: center;
        }

        a {
            color: #0b3d62;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Create SmartBank Account</h1>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/register">
            <label>Full Name</label>
            <input type="text" name="full_name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Phone Number</label>
            <input type="tel" name="phone" required pattern="[0-9]{10}" title="Enter a 10-digit phone number">
            <label>Password</label>
            <input type="password" name="password" required>

            <label>4-Digit Transaction PIN</label>
            <input type="password" name="pin" maxlength="4" required>

            <button type="submit">Create Account</button>
        </form>

        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>

</body>
</html>
