<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | SmartBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .navbar {
            background: #0b3d62;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .navbar h1 {
            font-size: 20px;
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #0b3d62;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0b3d62;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b6ca8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #0b3d62;
        }

        .flash-message {
            background: #fdecea;
            color: #b02a37;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>SmartBank</h1>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/profile">Profile</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Edit Profile</h2>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="/edit-profile">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ user['full_name'] }}" required>

                <label>Email</label>
                <input type="email" name="email" value="{{ user['email'] }}" required>

                <label>Phone Number</label>
                <input type="text" name="phone" value="{{ user['phone'] }}" maxlength="10" required>

                <button type="submit">Update Profile</button>
            </form>

            <a href="/profile" class="back-btn">Back to Profile</a>
        </div>
    </div>

</body>
</html>
