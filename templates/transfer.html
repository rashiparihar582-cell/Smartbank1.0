<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money | SmartBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .navbar {
            background: #0b3d62;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #0b3d62;
            margin-bottom: 20px;
        }

        .balance {
            background: #e7f6ec;
            color: #1e7e34;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #0b3d62;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b6ca8;
        }

        .flash-message {
            background: #fdecea;
            color: #b02a37;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            color: #0b3d62;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>SmartBank</h1>
        <div>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
            <a href="/scam-awareness">Scam Awareness</a>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Transfer Money</h2>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <div class="balance">
                Available Balance: Rs. {{ user['balance'] }}
            </div>

            <form method="POST" action="/transfer">
                <label>Receiver Account Number</label>
                <input type="text" name="receiver_account" required>

                <label>Amount</label>
                <input type="number" name="amount" min="1" step="0.01" required>

                <label>Category</label>
                <select name="category" required>
                    <option value="Transfer">Transfer</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Bills">Bills</option>
                    <option value="Education">Education</option>
                    <option value="Savings">Savings</option>
                </select>

                <label>Description</label>
                <input type="text" name="description">

                <label>4-Digit Transaction PIN</label>
                <input type="password" name="pin" maxlength="4" required>

                <button type="submit">Transfer Money</button>
            </form>

            <a href="/dashboard" class="back-btn">Back to Dashboard</a>
        </div>
    </div>

</body>
</html>
